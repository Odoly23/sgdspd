{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Password</title>

<link rel="stylesheet" href="{% static 'css/bootstrap/css/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'css/bootstrap/css/all.min.css' %}">

</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height:100vh;">

        <div class="card shadow border-0" style="max-width:450px; width:100%;">
            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <i class="fa fa-lock fa-3x text-primary mb-3"></i>
                    <h4>Troka Password</h4>
                </div>

                <form method="POST">
                    {% csrf_token %}

                    <div class="form-group">
                        <label>Password Foun</label>
                        <input type="password"
                               name="new_password1"
                               class="form-control"
                               required>
                    </div>

                    <div class="form-group">
                        <label>Konfirma Password</label>
                        <input type="password"
                               name="new_password2"
                               class="form-control"
                               required>
                    </div>

                    <button type="submit"
                            class="btn btn-primary btn-block">
                        <i class="fa fa-save"></i>
                        Rai Password
                    </button>

                </form>

            </div>
        </div>

    </div>
</div>

</body>
</html>
