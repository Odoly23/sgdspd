{% load static %}
<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Sistema</title>

<!-- Bootstrap 4 -->
<link rel="stylesheet" href="{% static 'css/bootstrap/css/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'css/bootstrap/css/all.min.css' %}">
<link rel="stylesheet" href="{% static 'webfonts/css/all.min.css' %}">
<link rel="stylesheet" href="{% static 'css/logins.css' %}">

</head>
<body class="bg-light">

<div class="login-wrapper d-flex align-items-center justify-content-center" style="min-height:100vh;">

    <div class="card login-card p-4 border-0 shadow-sm" style="width:380px; border-radius:12px;">

        <div class="card-body text-center">

            <!-- MESSAGES -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show small" role="alert">
                        {{ message }}
                        <button type="button" class="close" data-dismiss="alert">
                            <span>&times;</span>
                        </button>
                    </div>
                {% endfor %}
            {% endif %}

            <!-- LOGO -->
            <img src="{% static 'Images/images.png' %}" style="height:70px;" class="mb-3">

            <h5 class="font-weight-bold text-dark">Partido Democrático</h5>
            <small class="text-muted d-block mb-3">Sistema Login Access</small>

            <hr>

            <!-- FORM -->
            <form method="POST">
                {% csrf_token %}

                <!-- USERNAME -->
                <div class="input-group mb-3">
                    <div class="input-group-prepend">
                        <span class="input-group-text">
                            <i class="fas fa-user"></i>
                        </span>
                    </div>
                    <input type="text" name="username" class="form-control" placeholder="Username" required>
                </div>

                <!-- PASSWORD -->
                <div class="input-group mb-3">
                    <div class="input-group-prepend">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                    </div>
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>

                <!-- OPTIONS -->
                <div class="d-flex justify-content-between mb-3">
                    <div>
                        <input type="checkbox"> <small>Remember</small>
                    </div>
                    <a href="#" class="text-primary small">Haluha password?</a>
                </div>

                <!-- BUTTON -->
                <button type="submit" class="btn btn-primary btn-block">
                    Login <i class="fa fa-sign-in-alt"></i>
                </button>

            </form>

            <hr>

            <!-- FOOTER -->
            <small class="text-muted">
                © 2026 - {% now "Y" %} <br>
                Developed by Sec-IT-PADA
            </small>

        </div>
    </div>

</div>

</body>
</html>
