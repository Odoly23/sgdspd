{% load static %}
<!DOCTYPE html>
<html lang="tet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password</title>

<link rel="stylesheet" href="{% static 'css/bootstrap/css/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'css/bootstrap/css/all.min.css' %}">

<style>
body{
    background:#f5f6fa;
}

.reset-card{
    width:100%;
    max-width:420px;
    border-radius:15px;
}

.logo{
    height:70px;
}

.small-text{
    font-size:13px;
    color:#6c757d;
}
</style>

</head>
<body>

<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height:100vh;">

        <div class="card shadow border-0 reset-card">
            <div class="card-body p-4">

                <!-- LOGO -->
                <div class="text-center mb-4">
                    <img src="{% static 'Images/images.png' %}" class="logo mb-3">

                    <h4 class="font-weight-bold">
                        Reset Password
                    </h4>

                    <p class="small-text mb-0">
                        Hatama ita nia email atu simu link hodi troka password
                    </p>
                </div>

                <!-- FORM -->
                <form method="POST">
                    {% csrf_token %}

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="example@gmail.com"
                               required>
                        <small class="small-text">
                            Ita sei simu link reset iha email ne'e
                        </small>
                    </div>

                    <button type="submit"
                            class="btn btn-primary btn-block">
                        <i class="fa fa-paper-plane"></i>
                        Haruka Link Reset
                    </button>
                </form>

                <!-- BACK LOGIN -->
                <div class="text-center mt-3">
                    <a href="{% url 'login' %}">
                        ← Fila ba Login
                    </a>
                </div>

            </div>
        </div>

    </div>
</div>

</body>
</html>
